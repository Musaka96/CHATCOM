<svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="candleglow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a2615" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#100a08" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- dark, moody background like the painting's dim chamber -->
  <rect width="240" height="280" fill="#15100c"/>
  <rect width="240" height="280" fill="url(#candleglow)"/>

  <!-- distant window/doorway sliver of cold light, far background -->
  <rect x="178" y="20" width="34" height="90" fill="#2a3a35" opacity="0.5"/>

  <!-- seated body, slumped, elbow on a table/desk instead of a chair arm -->
  <path d="M70 240 Q120 226 170 240 L178 278 L62 278 Z" fill="#3a0f12"/>
  <!-- motley sleeve, half red half dark gold, classic Stańczyk palette -->
  <path d="M70 200 Q60 215 64 240 L92 236 Q88 214 96 198 Z" fill="#5c1014"/>
  <path d="M170 200 Q180 215 176 240 L148 236 Q152 214 144 198 Z" fill="#7a5a1f"/>

  <!-- table the laptop rests on, echoing the table in the original painting -->
  <rect x="40" y="244" width="160" height="10" fill="#241a12"/>
  <rect x="48" y="254" width="10" height="22" fill="#1a130c"/>
  <rect x="182" y="254" width="10" height="22" fill="#1a130c"/>

  <!-- laptop, lit faintly like the only bright object in his hands -->
  <rect x="84" y="216" width="72" height="40" rx="4" fill="#1c140d" stroke="#7a5a1f" stroke-width="1.5"/>
  <rect x="90" y="222" width="60" height="24" rx="2" fill="#8a6a2a" fill-opacity="0.55"/>

  <!-- torso, dark red motley doublet with a few small gold diamonds -->
  <path d="M80 196 Q120 184 160 196 L168 244 Q120 256 72 244 Z" fill="#4a0f12"/>
  <rect x="108" y="206" width="12" height="12" fill="#8a6a2a" transform="rotate(45 114 212)"/>
  <rect x="132" y="214" width="10" height="10" fill="#8a6a2a" transform="rotate(45 137 219)"/>

  <!-- head tipped down onto resting hand, the painting's signature melancholic pose -->
  <g>
    <!-- forearm propping up the head -->
    <path d="M150 244 Q172 226 158 206" stroke="#4a0f12" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="156" cy="204" r="9" fill="#caa06a"/>
    <!-- head, slightly bowed, weary expression -->
    <circle cx="128" cy="190" r="34" fill="#c79b66"/>
    <path d="M112 188 Q116 184 120 188" stroke="#1a0f08" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M134 184 Q138 180 142 184" stroke="#1a0f08" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M114 204 Q128 208 140 200" stroke="#3a1f10" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- furrowed, thoughtful brow -->
    <path d="M110 180 Q116 176 122 180" stroke="#1a0f08" stroke-width="2" fill="none"/>
    <path d="M132 178 Q138 174 144 179" stroke="#1a0f08" stroke-width="2" fill="none"/>
  </g>

  <!-- jester hood, deep red and muted gold, drooping points like the original cap and bells -->
  <path d="M96 168 Q70 150 78 112 Q96 132 104 152 Z" fill="#5c1014"/>
  <path d="M160 168 Q188 150 180 112 Q162 132 154 152 Z" fill="#7a5a1f"/>
  <path d="M128 156 Q120 110 140 78 Q150 116 144 152 Z" fill="#4a0f12"/>
  <circle cx="78" cy="112" r="5" fill="#9c7a32" opacity="0.85"/>
  <circle cx="180" cy="112" r="5" fill="#9c7a32" opacity="0.85"/>
  <circle cx="140" cy="78" r="5" fill="#9c7a32" opacity="0.85"/>
  <path d="M92 166 Q128 144 164 166 Q160 180 128 180 Q96 180 92 166 Z" fill="#3a0f12"/>

  <!-- small candle on the table, the one warm point of light in the scene -->
  <rect x="196" y="240" width="6" height="16" fill="#caa06a"/>
  <ellipse cx="199" cy="236" rx="4" ry="7" fill="#e8b840" opacity="0.9"/>
</svg>
